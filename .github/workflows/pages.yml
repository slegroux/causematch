name: Website

# The public website on GitHub Pages: site/ plus the shared assets, assembled by
# scripts/build_site.sh. Needs Pages enabled with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/assets/**
      - static/vendor/fonts/**
      - scripts/build_site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: scripts/build_site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
